version: '3.8'

services:
  metabolomics-pathway-flux-engine:
    build: .
    container_name: metabolomics-pathway-flux-engine
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=${AUDIT_SECRET_KEY:-changeme-please-set-a-secure-random-key}
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
